<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> 
    <!-- FontAwesome placeholder; using CDN usually works, but standard icons often better manually if offline. 
         I will use SVG icons in HTML if needed, but let's try to assume icons will be handled by CSS or simple text if CDN blocked. -->
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="chat-container">
        <header class="chat-header">
            <div class="logo">
                <div class="logo-icon">IA</div>
                <div class="logo-text">
                    <h1>Institute Assistant</h1>
                    <span class="status">Online</span>
                </div>
            </div>
        </header>

        <div class="chat-body" id="chat-box">
            <div class="message bot-message">
                <div class="avatar">IA</div>
                <div class="message-content">
                    <p>Hello! I'm here to answer your questions about the institute. Ask me about timings, fees, admissions, or courses!</p>
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
        <div class="footer-note">Week 1: Basic FAQ Responder</div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
